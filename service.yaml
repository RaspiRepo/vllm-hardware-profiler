apiVersion: v1
kind: Service
metadata:
  name: vllm-hardware-profiler
  namespace: nemotron
  labels:
    app: vllm-hardware-profiler
    component: telemetry
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
      protocol: TCP
  selector:
    app: vllm-hardware-profiler